name: sinau-satwa-production

x-app: &app
  build: .
  env_file: .env
  init: true
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  volumes:
    - private_data:/app/var
    - static_data:/app/staticfiles
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sinau}
      POSTGRES_USER: ${POSTGRES_USER:-sinau}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  web:
    <<: *app
    command: [gunicorn, config.wsgi:application, --bind, '0.0.0.0:8000', --workers, '3', --timeout, '90', --access-logfile, '-', --access-logformat, '%(h)s %(m)s %(U)s %(s)s']
    ports:
      - '127.0.0.1:${WEB_PORT:-18000}:8000'
  worker:
    <<: *app
    command: [celery, -A, config, worker, --loglevel=info, --concurrency=2]
  beat:
    <<: *app
    command: [celery, -A, config, beat, --loglevel=info, --schedule, /app/var/celerybeat-schedule]

volumes:
  postgres_data:
  redis_data:
  private_data:
  static_data:
