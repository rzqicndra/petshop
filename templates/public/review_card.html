<article class="review-card">
<div class="stars" aria-label="Rating {{ review.rating }} dari 5">{{ review.rating }} / 5</div><blockquote>“{{ review.comment }}”</blockquote><strong>{{ review.customer.name|truncatechars:30 }}</strong>
<p class="verified">✓ Transaksi selesai terverifikasi</p>
</article>
