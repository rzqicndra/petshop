{% if page.paginator.num_pages > 1 %}<nav class="pagination" aria-label="Halaman data">{% if page.has_previous %}<a href="{% querystring page=page.previous_page_number %}">← Sebelumnya</a>{% else %}<span></span>{% endif %}<span>{{ page.number }} dari {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a href="{% querystring page=page.next_page_number %}">Berikutnya →</a>{% else %}<span></span>{% endif %}</nav>{% endif %}
